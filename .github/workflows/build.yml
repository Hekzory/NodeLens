name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: |
          uv run pytest tests/ -v \
            --cov=nodelens \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingestor
            dockerfile: deploy/ingestor.Dockerfile
            context: .
            publish: true
          - name: alerts
            dockerfile: deploy/alerts.Dockerfile
            context: .
            publish: true
          - name: api
            dockerfile: deploy/api.Dockerfile
            context: .
            publish: true
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
            publish: true
          - name: plugins-worker
            dockerfile: deploy/plugins.Dockerfile
            context: .
            publish: false

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: matrix.publish && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        if: matrix.publish
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hekzory/nodelens-${{ matrix.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ matrix.publish && github.event_name != 'pull_request' }}
          load: false
          tags: ${{ matrix.publish && steps.meta.outputs.tags || format('{0}:ci-verify', matrix.name) }}
          labels: ${{ matrix.publish && steps.meta.outputs.labels || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
