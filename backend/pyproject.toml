[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodelens"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.50,<3",
    "asyncpg>=0.31.0,<1",
    "psycopg[binary,pool]>=3.3.4,<4",
    "redis>=7.4.0,<8",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "ruamel.yaml~=0.19.1",
    "fastapi>=0.136.3,<1",
    "granian[pname,uvloop]>=2.7.6,<3",
    "alembic>=1.18.4,<2",
    "bcrypt>=5.0,<6",
    "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "httpx>=0.28.1,<1",
    "testcontainers[postgres,redis]>=4.14.2,<5",
    "ruff~=0.15.17",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: spins up real Postgres/Redis via testcontainers (auto-skips without Docker)",
]
filterwarnings = [
    # testcontainers' RedisContainer still uses a decorator its own maintainers
    # have deprecated — nothing we can change here until they ship the fix.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["nodelens"]
# Omits are reserved for process entry points and top-level glue: code that
# does nothing but compose already-tested units inside a `while True` /
# `asyncio.run(...)` shell. Unit-testing them would require mocking out every
# callee, which only verifies the mocks. They're covered (when at all) by
# integration tests, not pytest.
omit = [
    "nodelens/__main__.py",
    "nodelens/*/__main__.py",
    "nodelens/*/*/__main__.py",
    # FastAPI app factory — declarative router/middleware wiring done at process
    # start; exercised (not credited) by the integration suite via the real app.
    # (api/middleware.py is NOT omitted: it holds real ETag/CSRF logic that the
    # integration tests cover through the real app.)
    "nodelens/api/app.py",
    # Worker main loops: Redis stream poll → call already-tested writer/evaluator/dispatcher.
    "nodelens/workers/ingestor/consumer.py",
    "nodelens/workers/alerts/engine.py",
    # `python -m` subprocess entry point that drives the plugin lifecycle
    # using already-tested loader / config / context / SDK code.
    "nodelens/workers/plugin_runner/run_single.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = false
precision = 1
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["nodelens"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — undefined names, unused imports, obvious bugs
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear — likely bugs and design problems
    "UP",     # pyupgrade — modernize syntax for target python version
    "PERF",   # perflint — performance anti-patterns
    "FAST",   # ruff-fastapi — FastAPI-specific linting rules
    "ASYNC",  # ruff-async — async/await linting rules
    "C4",     # ruff-comprehensions — comprehensions and generator expressions
    "DTZ",    # ruff-datetime — datetime anti-patterns
    "FA",     # future annotations
    "PIE",    # misc linting rules, including some flake8-pie rules
    "PT",     # ruff-pytest — pytest-specific linting rules
    "RET",    # ruff-return — return statement linting rules
    "SIM",    # ruff-simplify — code simplification rules
    "SLOT",   # ruff-slot — dataclass and class definition linting rules
    "TC",     # ruff-type-checking — type checking linting rules
    "FLY",    # flynt
    "I",      # isort — import sorting rules
    "PLE",    # pylint errors
    "PLC",    # pylint convention rules
    "PLR",    # pylint refactor rules
    "PLW",    # pylint warning rules
    "FURB"    # refurb - refactoring rules
]

ignore = [
    "FAST002",  # dependency annotations
    "PLC2701",
    "PLC0415",
    "PLR6301",   # could be a function, class method or static method
    "PLR2004",   # magic values
    "PLR0915",   # too many statements
    "PLR0913",   # too many arguments
    "PLR0912",   # too many branches
    "PLR0917",   # too many positional arguments
    "PLW0603",   # using global statement to update
    # TC001/TC002/TC003 want imports moved into TYPE_CHECKING blocks when the
    # name is "only used in annotations". FastAPI (Depends-injected params,
    # path/body types) and Pydantic (field types) resolve those annotations at
    # runtime via `get_type_hints()`, even with `from __future__ import
    # annotations`. Moving the imports under TYPE_CHECKING would break route
    # registration and Pydantic model schemas at import time.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
